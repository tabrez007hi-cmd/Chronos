<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="85%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#060607" />
    </radialGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
  </defs>

  <!-- Base background (for maskable safe zone) -->
  <rect width="512" height="512" fill="#09090b" />

  <!-- Classic Bezel Ring -->
  <circle cx="256" cy="256" r="212" fill="url(#dialGrad)" stroke="url(#bezelGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- 12 Classic Hour Batons -->
  <!-- 12 o'clock -->
  <rect x="252" y="74" width="8" height="28" rx="4" fill="#fbbf24" />
  <!-- 1 o'clock (30 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(30 256 256)" />
  <!-- 2 o'clock (60 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(60 256 256)" />
  <!-- 3 o'clock (90 deg) -->
  <rect x="252" y="74" width="8" height="28" rx="4" fill="#fbbf24" transform="rotate(90 256 256)" />
  <!-- 4 o'clock (120 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(120 256 256)" />
  <!-- 5 o'clock (150 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(150 256 256)" />
  <!-- 6 o'clock (180 deg) -->
  <rect x="252" y="74" width="8" height="28" rx="4" fill="#fbbf24" transform="rotate(180 256 256)" />
  <!-- 7 o'clock (210 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(210 256 256)" />
  <!-- 8 o'clock (240 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(240 256 256)" />
  <!-- 9 o'clock (270 deg) -->
  <rect x="252" y="74" width="8" height="28" rx="4" fill="#fbbf24" transform="rotate(270 256 256)" />
  <!-- 10 o'clock (300 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(300 256 256)" />
  <!-- 11 o'clock (330 deg) -->
  <rect x="253" y="76" width="6" height="20" rx="3" fill="#a1a1aa" transform="rotate(330 256 256)" />

  <!-- Classic Horological Hands at 10:10 -->
  <!-- Hour hand pointing at ~10 (305 deg) -->
  <g transform="rotate(-55 256 256)">
    <rect x="250" y="152" width="12" height="108" rx="6" fill="url(#handGrad)" />
    <polygon points="256,134 250,154 262,154" fill="url(#handGrad)" />
  </g>

  <!-- Minute hand pointing at ~2 (55 deg) -->
  <g transform="rotate(55 256 256)">
    <rect x="252" y="104" width="8" height="156" rx="4" fill="url(#handGrad)" />
    <polygon points="256,86 252,106 260,106" fill="url(#handGrad)" />
  </g>

  <!-- Classic Slender Second Hand pointing at ~12:04 with tail (warm amber) -->
  <g transform="rotate(24 256 256)">
    <line x1="256" y1="292" x2="256" y2="78" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="256" cy="276" r="6" fill="#f59e0b" />
  </g>

  <!-- Center Hub Pin -->
  <circle cx="256" cy="256" r="11" fill="#d97706" />
  <circle cx="256" cy="256" r="5" fill="#fef3c7" />
</svg>
